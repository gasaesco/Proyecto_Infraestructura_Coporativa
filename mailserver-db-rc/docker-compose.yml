services:

  # 1) Mail server (docker-mailserver — Postfix + Dovecot)
  mailserver:
    image: docker.io/mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: empresa.local
    env_file:
      - ./mailserver.env
    ports:
      - "25:25"     # SMTP
      - "587:587"   # Submission (STARTTLS)
      - "143:143"   # IMAP
      - "993:993"   # IMAPS
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - ./docker-mailserver-config/:/tmp/docker-mailserver/
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - assr-net

  # 2) Roundcube webmail (uses MariaDB)
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: roundcubemail
      MYSQL_USER: roundcube
      MYSQL_PASSWORD: rcpass123
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - assr-net

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    depends_on:
      - mariadb
      - mailserver
    ports:
      - "3000:3000"   # accede desde navegador
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_USE_SSL=true
      - ROUNDCUBEMAIL_DB_TYPE=mysql
      - ROUNDCUBEMAIL_DB_HOST=mariadb
      - ROUNDCUBEMAIL_DB_USER=roundcube
      - ROUNDCUBEMAIL_DB_PASSWORD=rcpass123
      - ROUNDCUBEMAIL_DB_NAME=roundcubemail
    volumes:
      - roundcube_data:/var/roundcube
    restart: unless-stopped
    networks:
      - assr-net

volumes:
  maildata:
  mailstate:
  mariadb_data:
  roundcube_data:

networks:
  assr-net:
    external: true
