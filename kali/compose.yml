services:
  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    hostname: kali
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ./work:/root/work
    command: >
      bash -lc "
      apt-get update &&
      apt-get install -y iproute2 iputils-ping curl wget netcat-traditional dnsutils &&
      bash
      "

networks:
  default:
    name: assr-net
