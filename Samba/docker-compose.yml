version: "3.8"

services:
  samba:
    build: .
    container_name: samba
    restart: unless-stopped
    environment:
      - TZ=America/Guayaquil
    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
      - "445:445/tcp"
    volumes:
      - ./data/archivos:/share/archivos
