services:
  mailserver:
    image: docker.io/mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mailserver.assr.local
    domainname: empresa.local
    env_file:
      - ./mailserver/mailserver.env
    ports:
      - "25:25"
      - "587:587"
      - "143:143"
      - "993:993"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - ./mailserver/docker-mailserver-config/:/tmp/docker-mailserver/
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - assr-net

volumes:
  maildata:
  mailstate:

networks:
  assr-net:
    external: true
